name: Build Windows portable app
on:
  workflow_dispatch:
  push:
    branches: [ "claude/trusting-goodall-313vmr" ]
    paths: [ "app/**", "ditl-workbench-v*.html", ".github/workflows/build-windows.yml" ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: app
        run: npm install
      - name: Build portable exe
        working-directory: app
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: DCS-Engineering-Station-portable
          path: app/dist/*.exe
